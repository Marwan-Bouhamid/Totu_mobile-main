<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    

<div class="flex min-h-screen">

  <aside class="w-64 bg-gray-800 text-white p-6">
    <h2 class="text-xl font-bold mb-6">Admin</h2>
    <nav class="space-y-2">
      <a href="#" class="block px-4 py-2 bg-blue-600 text-white rounded-lg">Catégories</a>
      <a href="#" class="block px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700">Produits</a>
      <a href="#" class="block px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700">Utilisateurs</a>
    </nav>
  </aside>

  <div class="flex-1 flex flex-col">

    <header class="flex items-center justify-between bg-white border-b px-6 py-4">
      <h1 class="text-xl font-semibold">Gestion des catégories</h1>
      <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
        Nouvelle catégorie
      </button>
    </header>

    <main class="flex-1 p-6">
      <div class="max-w-5xl mx-auto">

        <form class="mb-8 space-y-4">
          <div>
            <label for="nom" class="block mb-1 text-sm font-medium">Nom</label>
            <input id="nom" type="text"
              class="border border-gray-300 rounded-lg w-full p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label for="description" class="block mb-1 text-sm font-medium">Description</label>
            <textarea id="description" rows="3"
              class="border border-gray-300 rounded-lg w-full p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
          </div>
        </form>

        <table class="w-full">
          <thead>
            <tr>
              <th class="bg-gray-50 text-left text-xs text-gray-500 uppercase p-3">ID</th>
              <th class="bg-gray-50 text-left text-xs text-gray-500 uppercase p-3">Nom</th>
              <th class="bg-gray-50 text-left text-xs text-gray-500 uppercase p-3">Description</th>
            </tr>
          </thead>
          <tbody>
            <tr class="border-b">
              <td class="p-3">1</td>
              <td class="p-3">Électronique</td>
              <td class="p-3">Appareils et accessoires</td>
            </tr>
            <tr class="border-b">
              <td class="p-3">2</text-xltd>
              <td class="p-3">Vêtements</td>
              <td class="p-3">Mode homme et femme</td>
            </tr>
          </tbody>
        </table>

      </div>
    </main>
  </div>
</div>
</body>
</html>
